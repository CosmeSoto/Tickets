[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
compress-type=zst
compress-level=3
start-fast=y
delta=y
log-level-console=info
log-level-file=info
log-path=/var/log/pgbackrest
# NO usar archive-async — archive_command de PostgreSQL requiere modo síncrono
# NO usar pg1-host — el worker accede al datadir y socket por volúmenes compartidos (sin SSH)

[main]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=tickets_user
pg1-database=tickets_db
